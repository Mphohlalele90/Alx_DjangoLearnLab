<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book List</title>
</head>
<body>
    <h1>Bookshelf</h1>
    <table>
        <tr>
            <th>Title</th>
            <th>Author</th>
        </tr>
        {% for book in books %}
        <tr>
            <td>{{ book.title }}</td>
            <td>{{ book.author }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="2">No books available.</td>
        </tr>
        {% endfor %}
    </table>

    <!-- Example search form -->
    <form method="post">
        {% csrf_token %}
        <input type="text" name="search" placeholder="Search by title">
        <button type="submit">Search</button>
    </form>
</body>
</html>
