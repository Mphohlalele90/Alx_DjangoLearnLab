{% extends "blog/base.html" %}
{% block content %}
    <article class="post">
        <h2>{{ post.title }}</h2>
        {% if post.featured_image %}
            <img src="{{ post.featured_image.url }}" alt="{{ post.title }}" class="img-fluid mb-3">
        {% endif %}
        <p class="meta">
            By {{ post.author }} on {{ post.published_date|date:"F d, Y" }}
            {% if user == post.author %}
                <a href="{% url 'post-update' post.pk %}" class="btn btn-sm btn-outline-secondary">Edit</a>
                <a href="{% url 'post-delete' post.pk %}" class="btn btn-sm btn-outline-danger">Delete</a>
            {% endif %}
        </p>
        <div class="content">{{ post.content|linebreaks }}</div>
    </article>
{% endblock %}
