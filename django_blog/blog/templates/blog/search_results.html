<!-- blog/templates/blog/search_results.html -->
{% extends 'base.html' %}

{% block content %}
<h1>Search Results</h1>
{% if posts %}
    <ul>
    {% for post in posts %}
        <li>
            <a href="{{ post.get_absolute_url }}">{{ post.title }}</a>
        </li>
    {% endfor %}
    </ul>
{% else %}
    <p>No results found.</p>
{% endif %}
{% endblock %}
