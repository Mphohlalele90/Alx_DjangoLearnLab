<h2>Login</h2>
{% if error %}<p style="color:red">{{ error }}</p>{% endif %}
<form method="post">
  {% csrf_token %}
  <label>Username:</label>
  <input type="text" name="username" required title="Enter your username" placeholder="Username"><br>
  <label>Password:</label>
  <input type="password" name="password" required title="Enter your password" placeholder="Password"><br>
  <button type="submit">Log in</button>
</form>
